name: Build VSIX

# 为什么需要这个工作流
# ------------------------------------------------------------------
# 引擎是**原生二进制，不能交叉编译**。想在 Windows / Linux / macOS 上都做到
# 「装上就能用、不需要用户自己装编译器」，唯一的办法是在各平台的原生机器上
# 各编译一次，再把产物合成 vsix。
#
# 仓库是 public 的，GitHub Actions 对公开仓库的构建分钟数**免费且不限量**，
# 所以这条路是零成本的。
#
# 为什么没有 macos-13（Intel）这个 job
# ------------------------------------------------------------------
# Intel macOS runner 正在被 GitHub 退役。实测 `macos-13` 会一直卡在
# "Waiting for a runner to pick up this job..."，要等到 6 小时 job 超时才失败。
# 改成在 Apple Silicon 上编一个 **universal 二进制**（同时含 x86_64 + arm64 两个切片），
# macOS 会自动选对应切片，所以 darwin-x64 / darwin-arm64 共用一份产物。
#
# 产物：每个平台一个专用 vsix（win32-x64 / linux-x64 / darwin-x64 / darwin-arm64）。
# 不产出「通用包」—— 通用包会被 ARM Linux、Windows ARM 之类的平台也装到，
# 然后报「引擎缺失」，比直接装不上更糟。

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '同时发布到 VS Code Marketplace（需要先配置 VSCE_PAT secret）'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write # 打 tag 时创建 Release 需要

env:
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------- 1) 各平台编译引擎
  engine:
    name: 引擎 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win32-x64
            os: windows-latest
            keys: win32-x64
          - name: linux-x64
            os: ubuntu-latest
            keys: linux-x64
          # 一份 universal 二进制同时供给两个 darwin 目标
          - name: darwin-x64 + darwin-arm64（universal）
            os: macos-14
            keys: darwin-x64 darwin-arm64
            extra: '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          # 想覆盖 ARM 平台可以再加（runner 处于 public preview，稳定性一般）：
          # - { name: linux-arm64, os: ubuntu-24.04-arm, keys: linux-arm64 }
          # - { name: win32-arm64, os: windows-11-arm,   keys: win32-arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # runner 上已经有 CMake + MSVC / GCC / Xcode CLT，build-core.mjs 会自己找 cmake。
      # extra 走环境变量传，避免 universal 参数里的分号被 shell 当成分隔符。
      - name: 配置 + 编译引擎
        env:
          EXTRA_CMAKE_ARGS: ${{ matrix.extra }}
        run: node scripts/build-core.mjs

      - name: 引擎自测（29 项）
        run: node scripts/test-core.mjs

      - name: 归位到 engines/<key>/
        shell: bash
        run: |
          set -euo pipefail
          for k in ${{ matrix.keys }}; do
            node scripts/collect-engine.mjs --key "$k"
          done
          ls -lR engines

      # upload-artifact 不保留文件权限位，所以先打成 tar 再上传，
      # 否则 Linux/macOS 的 depscan-core 下载回来就没有 +x 了。
      - name: 打包成 artifact
        shell: bash
        run: |
          set -euo pipefail
          for k in ${{ matrix.keys }}; do
            tar -czf "engine-$k.tar.gz" -C "engines/$k" .
          done

      - uses: actions/upload-artifact@v4
        with:
          name: engines-${{ matrix.os }}
          path: engine-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- 2) 合成 vsix
  package:
    name: 打包 vsix
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          pattern: engines-*
          path: artifacts

      - name: 把各平台引擎归位到 engines/
        shell: bash
        run: |
          set -euo pipefail
          for d in artifacts/engines-*; do
            for t in "$d"/*.tar.gz; do
              key="$(basename "$t" .tar.gz)"
              key="${key#engine-}"
              mkdir -p "engines/$key"
              tar -xzf "$t" -C "engines/$key"
            done
          done
          chmod +x engines/*/depscan-core 2>/dev/null || true
          ls -lR engines

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # 会跑 typecheck + esbuild + webview 构建 + Webview 自检（32 项）
      - name: 构建扩展
        run: npm run build:prod

      - name: 逐平台打包（每个平台一个 vsix）
        shell: bash
        run: |
          set -euo pipefail
          for key in win32-x64 linux-x64 darwin-x64 darwin-arm64; do
            node scripts/package.mjs --target "$key"
          done
          ls -l ./*.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 30

      - name: 打 tag 时创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes ./*.vsix

      - name: 发布到 VS Code Marketplace
        if: ${{ inputs.publish }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::error::打了 publish 但没配 VSCE_PAT secret。见 docs/06-发布与版本管理.md"
            exit 1
          fi
          for f in ./*.vsix; do
            echo "== 发布 $f"
            npx --yes @vscode/vsce publish --packagePath "$f" -p "$VSCE_PAT"
          done
